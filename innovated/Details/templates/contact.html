
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Inquiry</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fc;
        }

        .contact-section{
            width:100%;
            padding:60px 20px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .contact-container{
            width:100%;
            max-width:1100px;
            background:#fff;
            border-radius:18px;
            overflow:hidden;
            display:flex;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        /* LEFT SIDE */

        .contact-left{
            width:40%;
            background:linear-gradient(135deg,#6c2bd9,#8b5cf6);
            color:white;
            padding:50px 35px;
        }

        .contact-left h1{
            font-size:38px;
            margin-bottom:20px;
        }

        .contact-left p{
            line-height:28px;
            font-size:16px;
            color:#f1f1f1;
        }

        .contact-info{
            margin-top:40px;
        }

        .contact-info div{
            margin-bottom:18px;
            font-size:15px;
        }

        /* RIGHT SIDE */

        .contact-right{
            width:60%;
            padding:50px;
        }

        .contact-right h2{
            font-size:32px;
            margin-bottom:30px;
            color:#222;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-row{
            display:flex;
            gap:20px;
        }

        .form-row .form-group{
            width:50%;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#444;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            outline:none;
            font-size:15px;
            transition:0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color:#6c2bd9;
            box-shadow:0 0 8px rgba(108,43,217,0.2);
        }

        textarea{
            resize:none;
            height:120px;
        }

        .extra-fields{
            display:none;
        }

        .submit-btn{
            width:100%;
            background:linear-gradient(135deg,#6c2bd9,#8b5cf6);
            color:white;
            padding:15px;
            border:none;
            border-radius:10px;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            transform:translateY(-2px);
        }

        /* MOBILE RESPONSIVE */

        @media(max-width:900px){

            .contact-container{
                flex-direction:column;
            }

            .contact-left,
            .contact-right{
                width:100%;
            }

            .form-row{
                flex-direction:column;
            }

            .form-row .form-group{
                width:100%;
            }

            .contact-left{
                padding:40px 25px;
            }

            .contact-right{
                padding:40px 25px;
            }

            .contact-left h1{
                font-size:30px;
            }

            .contact-right h2{
                font-size:28px;
            }
        }

    </style>

</head>
<body>

<section class="contact-section">

    <div class="contact-container">

        <!-- LEFT -->

        <div class="contact-left">

            <h1>Let's Connect</h1>

            <p>
                Have questions about compliance, governance, or services?
                Fill out the form and our team will get back to you shortly.
            </p>

            <div class="contact-info">

                <div>📧 support@innovatedhrtech.in</div>
                <div>📞 +91 9876543210</div>
                <div>📍 Mumbai, India</div>

            </div>

        </div>

        <!-- RIGHT -->

        <div class="contact-right">

            <h2>Contact Inquiry Form</h2>

            <form method="POST">

                {% csrf_token %}

                <div class="form-row">

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label>User Type</label>

                        <select name="user_type" id="user_type" onchange="showFields()" required>
                            <option value="">Select</option>
                            <option value="Student">Student</option>
                            <option value="Employee">Employee</option>
                            <option value="Customer">Customer</option>
                        </select>

                    </div>

                </div>

                <!-- STUDENT -->

                <div id="student_fields" class="extra-fields">

                    <div class="form-row">

                        <div class="form-group">
                            <label>University</label>
                            <input type="text" name="university">
                        </div>

                        <div class="form-group">
                            <label>Course</label>
                            <input type="text" name="course">
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Graduation Year</label>
                        <input type="number" name="graduation_year">
                    </div>

                </div>

                <!-- EMPLOYEE -->

                <div id="employee_fields" class="extra-fields">

                    <div class="form-row">

                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" name="company">
                        </div>

                        <div class="form-group">
                            <label>Designation</label>
                            <input type="text" name="designation">
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" name="department">
                    </div>

                </div>

                <!-- CUSTOMER -->

                <div id="customer_fields" class="extra-fields">

                    <div class="form-row">

                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" name="company_name">
                        </div>

                        <div class="form-group">
                            <label>Industry</label>
                            <input type="text" name="industry">
                        </div>

                    </div>

                    <div class="form-group">
                        <label>Company Size</label>
                        <input type="text" name="company_size">
                    </div>

                </div>

                <div class="form-group">

                    <label>Message</label>
                    <textarea name="message"></textarea>

                </div>

                <button type="submit" class="submit-btn">
                    Submit Inquiry
                </button>

            </form>

        </div>

    </div>

</section>

<script>

    function showFields(){

        let userType = document.getElementById("user_type").value;

        document.getElementById("student_fields").style.display = "none";
        document.getElementById("employee_fields").style.display = "none";
        document.getElementById("customer_fields").style.display = "none";

        if(userType === "Student"){
            document.getElementById("student_fields").style.display = "block";
        }

        else if(userType === "Employee"){
            document.getElementById("employee_fields").style.display = "block";
        }

        else if(userType === "Customer"){
            document.getElementById("customer_fields").style.display = "block";
        }
    }

</script>

</body>
</html>
