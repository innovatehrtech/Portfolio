<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Enquiry Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef2ff;
    min-height:100vh;
}

/* OPEN BUTTON */

.open-btn{
    padding:14px 30px;
    background:#7c3aed;
    color:white;
    border:none;
    border-radius:40px;
    cursor:pointer;
    font-size:16px;
    margin:100px auto;
    display:block;
}

/* MODAL */

.modal{
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.55);
    position:fixed;
    top:0;
    left:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:1000;
}

.modal-content{
    width:100%;
    max-width:1150px;
    background:white;
    border-radius:22px;
    padding:45px;
    position:relative;
    animation:popup 0.4s ease;
}

@keyframes popup{
    from{
        transform:scale(0.9);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.close-btn{
    position:absolute;
    right:25px;
    top:20px;
    font-size:42px;
    cursor:pointer;
    color:#111;
}

.heading{
    text-align:center;
    margin-bottom:35px;
}

.heading h1{
    font-size:42px;
    color:#111827;
    margin-bottom:10px;
}

.heading p{
    color:#6b7280;
    font-size:16px;
}

/* FORM */

.form-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:18px;
}

.form-group{
    width:100%;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:500;
    color:#111827;
}

input,
select,
textarea{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#7c3aed;
    box-shadow:0 0 10px rgba(124,58,237,0.15);
}

textarea{
    resize:none;
    height:120px;
}

.full-width{
    grid-column:1/-1;
}

.submit-btn{
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    color:white;
    border:none;
    padding:14px 35px;
    border-radius:40px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(124,58,237,0.25);
}

.checkbox{
    margin-top:15px;
    margin-bottom:18px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    color:#374151;
    font-size:14px;
}

.checkbox input{
    width:auto;
    margin-top:3px;
}

/* MOBILE */

@media(max-width:992px){

    .modal-content{
        padding:30px 22px;
        max-height:95vh;
        overflow-y:auto;
    }

    .heading h1{
        font-size:30px;
    }

    .form-row{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    .form-row{
        grid-template-columns:1fr;
    }

    .heading h1{
        font-size:25px;
    }

    .heading p{
        font-size:14px;
    }

    .submit-btn{
        width:100%;
    }

    .close-btn{
        font-size:34px;
        top:15px;
    }
}

</style>
</head>
<body>

<button class="open-btn" onclick="openModal()">
    Enquire Now
</button>

<!-- MODAL -->

<div class="modal" id="enquiryModal">

    <div class="modal-content">

        <span class="close-btn" onclick="closeModal()">&times;</span>

        <div class="heading">

            <h1>Business Enquiry Form</h1>

            <p>
                Please drop in your details and we will get in touch with you shortly
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-row">

                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" name="name" placeholder="Enter Name" required>
                </div>

                <div class="form-group">
                    <label>Corporate Email ID *</label>
                    <input type="email" name="email" placeholder="Enter Corporate Email ID" required>
                </div>

                <div class="form-group">
                    <label>Company Name *</label>
                    <input type="text" name="company_name" placeholder="Enter Company Name">
                </div>

                <div class="form-group">
                    <label>Designation *</label>
                    <input type="text" name="designation" placeholder="Enter Designation">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Contact No. *</label>
                    <input type="text" name="phone" placeholder="Enter Contact No">
                </div>

                <div class="form-group">
                    <label>Location/City/State *</label>
                    <input type="text" name="location" placeholder="Enter Location">
                </div>

                <div class="form-group">
                    <label>Enquiry For *</label>

                    <select name="enquiry_for">

                        <option>Select an option</option>
                        <option>Compliance Service</option>
                        <option>Audit Service</option>
                        <option>Governance</option>
                        <option>Risk Management</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>How did you hear about us?</label>

                    <select name="source">

                        <option>Select an option</option>
                        <option>Google</option>
                        <option>LinkedIn</option>
                        <option>Instagram</option>
                        <option>Reference</option>

                    </select>

                </div>

            </div>

            <div class="form-row">

                <div class="form-group full-width">

                    <textarea name="message"
                    placeholder="Enter Your Message"></textarea>

                </div>

            </div>

            <div class="checkbox">

                <input type="checkbox" required>

                <span>
                    By proceeding, you are indicating your acceptance of
                    Privacy Policy and Terms & Conditions.
                </span>

            </div>

            <button type="submit" class="submit-btn">
                Submit →
            </button>

        </form>

    </div>

</div>

<script>

function openModal(){
    document.getElementById("enquiryModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("enquiryModal").style.display = "none";
}

</script>

</body>
</html>
